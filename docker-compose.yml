# PoolPilot — 3 services on the T630's shared `coolify` network, behind Traefik.
# Deploy via Coolify (Docker Compose resource) or SSH (`docker compose up -d --build`).
# Secrets come from a sibling .env (see .env.deploy.example) or Coolify's env UI.
services:
  pool-db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pool
      POSTGRES_USER: pool
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pool-db-data:/var/lib/postgresql/data
    networks: [coolify]

  pool-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on: [pool-db]
    environment:
      NODE_ENV: production
      # Defaults talk straight to the ESP32. To cut over to the failover guardian,
      # set BRIDGE_HOST=pool-guardian in Coolify's env (the guardian's network alias
      # on the shared coolify network) and redeploy — no code change needed.
      BRIDGE_HOST: ${BRIDGE_HOST:-192.168.4.60}
      BRIDGE_PORT: ${BRIDGE_PORT:-8899}
      PUMP_ADDRESS: 96
      DB_HOST: pool-db
      DB_PORT: 5432
      DB_USER: pool
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: pool
      POLL_MS: 1000
      KEEP_ALIVE_MS: ${KEEP_ALIVE_MS:-5000}
      # Liveness check on the bridge link. A stalled WiFi connection keeps the TCP
      # socket open, so without this the pump can lose its keep-alive for minutes and
      # revert to its onboard schedule (audible ramp down/up) with nothing logged.
      # 12 s sits above this link's routine multi-second read gaps and inside the
      # pump's ~3·KEEP_ALIVE_MS revert window. Raise if reconnects get chatty.
      BRIDGE_IDLE_MS: ${BRIDGE_IDLE_MS:-12000}
      BRIDGE_CONNECT_TIMEOUT_MS: ${BRIDGE_CONNECT_TIMEOUT_MS:-8000}
      BRIDGE_WRITE_TIMEOUT_MS: ${BRIDGE_WRITE_TIMEOUT_MS:-3000}
      # Keep false so redeploys are seamless: the pump holds its speed across the
      # container swap and reverts to its onboard schedule on its own timeout if we
      # don't come back. Set true to force an immediate handoff on shutdown instead.
      RELEASE_ON_SHUTDOWN: ${RELEASE_ON_SHUTDOWN:-false}
      SESSION_SECRET: ${SESSION_SECRET}
      POOL_PASSWORD: ${POOL_PASSWORD}
      COOKIE_DOMAIN: .mght630.com
      CORS_ORIGIN: https://pool.mght630.com
    networks: [coolify]
    labels:
      - traefik.enable=true
      - traefik.http.routers.poolapi.rule=Host(`poolapi.mght630.com`)
      - traefik.http.routers.poolapi.entrypoints=https
      - traefik.http.routers.poolapi.tls=true
      - traefik.http.routers.poolapi.tls.certresolver=letsencrypt
      - traefik.http.services.poolapi.loadbalancer.server.port=3001

  pool-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://poolapi.mght630.com
    restart: unless-stopped
    depends_on: [pool-api]
    environment:
      NODE_ENV: production
    networks: [coolify]
    labels:
      - traefik.enable=true
      - traefik.http.routers.poolweb.rule=Host(`pool.mght630.com`)
      - traefik.http.routers.poolweb.entrypoints=https
      - traefik.http.routers.poolweb.tls=true
      - traefik.http.routers.poolweb.tls.certresolver=letsencrypt
      - traefik.http.services.poolweb.loadbalancer.server.port=3000

volumes:
  pool-db-data:

networks:
  coolify:
    external: true
