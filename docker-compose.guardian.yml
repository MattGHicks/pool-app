# pool-guardian — deploy as its OWN Coolify resource (separate from the app stack)
# so that redeploying pool-api never restarts the guardian. The guardian holds the
# persistent connection to the ESP32 and bridges the pump across app downtime.
#
#   docker compose -f docker-compose.guardian.yml up -d --build
#
# After it's up, point pool-api at it: set BRIDGE_HOST to this container's address
# (e.g. the host IP or, on the shared coolify network, the service name) and
# BRIDGE_PORT=8899, then redeploy pool-api.
services:
  pool-guardian:
    build:
      context: .
      dockerfile: apps/guardian/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8899
      UPSTREAM_HOST: 192.168.4.60
      UPSTREAM_PORT: 8899
      PUMP_ADDRESS: 96
      KEEP_ALIVE_MS: ${KEEP_ALIVE_MS:-5000}
      FAILOVER_MAX_MS: ${FAILOVER_MAX_MS:-300000}
      # Rebuild the ESP32 link if it stops carrying bytes. The app polls at 1 Hz, so a
      # silent upstream is a dead one — and a dead-but-open socket means the pump is
      # getting no keep-alive. Keep in step with pool-api's BRIDGE_IDLE_MS.
      UPSTREAM_IDLE_MS: ${UPSTREAM_IDLE_MS:-12000}
      UPSTREAM_CONNECT_TIMEOUT_MS: ${UPSTREAM_CONNECT_TIMEOUT_MS:-8000}
    # Published on the host for the calibrate script / debugging. pool-api reaches
    # the guardian over the shared coolify network via the `pool-guardian` alias
    # below (set BRIDGE_HOST=pool-guardian on pool-api).
    ports:
      - "8899:8899"
    networks:
      coolify:
        aliases:
          - pool-guardian

networks:
  coolify:
    external: true
