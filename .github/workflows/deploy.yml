name: Deploy to Coolify

# Coolify is private (LAN/Tailscale only — public requests get 403 by design).
# So the runner joins the tailnet, then calls Coolify's deploy API on the T630's
# Tailscale IP. Fires on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest

      - name: Trigger Coolify deployment
        run: |
          curl --fail-with-body -sS \
            "http://100.85.179.110:8000/api/v1/deploy?uuid=wocw4w0swk4cws8k8gws4k88&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
