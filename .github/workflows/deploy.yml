name: Deploy to Coolify

# Runs on a self-hosted runner ON the T630, so it can reach Coolify's API
# directly at localhost:8000. Coolify's dashboard stays private (not exposed
# to the public internet) — the runner is inside the network, GitHub just
# tells it "go".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl --fail-with-body -sS \
            "http://localhost:8000/api/v1/deploy?uuid=${{ vars.COOLIFY_APP_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
