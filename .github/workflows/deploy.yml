name: Deploy to Coolify

# Calls Coolify's deploy API on every push to main. Requires Coolify to be
# reachable from the public internet (it is, once the proxy route is healthy).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl --fail-with-body -sS \
            "https://coolify.mght630.com/api/v1/deploy?uuid=wocw4w0swk4cws8k8gws4k88&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
