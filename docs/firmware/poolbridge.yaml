# poolbridge.yaml — ESP32 transparent RS-485 <-> TCP bridge for PoolPilot
#
# Bridges the Pentair SuperFlo VST RS-485 bus (9600 8N1) over WiFi so pool-api (on the T630)
# can reach it. njsPC was retired at the PoolPilot cutover; pool-guardian now holds the
# single persistent TCP connection to this bridge on :8899 and relays for pool-api.
#
# Uses the oxan/esphome-stream-server external component. VERIFY the current option names
# against its README before flashing — the component's schema occasionally changes:
#   https://github.com/oxan/esphome-stream-server
#
# Flash:  cp secrets.yaml.example secrets.yaml  (edit it)  &&  esphome run poolbridge.yaml
#         OTA is enabled and port 3232 is reachable, so this flashes over WiFi — no USB
#         cable and no trip to the pad needed. Do it while the pump is off (after 18:00 ET):
#         the reboot drops the bridge for ~30s.

esphome:
  name: poolbridge
  friendly_name: Pool RS485 Bridge

esp32:
  board: esp32dev
  framework:
    type: esp-idf   # stream_server needs the ESP-IDF UART (IDFUARTComponent); arduino won't link
    # Added 2026-08-19 (experiment queue Step 3). The device asks for both of these on every
    # boot: "Bootloader supports SRAM1 as IRAM (+40KB)" and "Chip rev >= 3.0 detected".
    # +40KB IRAM lets more hot code run from fast internal RAM instead of being fetched from
    # flash, which should cut main-loop latency — the resource the stream server is starved of.
    # See EXPERIMENT-QUEUE.md.
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"

# ---------------------------------------------------------------------------
# Connectivity
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # KEEP THIS AT 'light' (the ESPHome ESP32 default). Do not set 'none'.
  #
  # 2026-08-13 we set power_save_mode: none to cut idle latency, and it did — ping while
  # the pump was off went from ~124ms avg to ~12ms. But it made the thing we actually care
  # about ~6x WORSE. Telemetry gaps >15s, normalised per hour of exposure:
  #
  #                 pump off   1500 rpm   2400 rpm
  #   power=light      3.3/hr    5.1/hr     6.0/hr
  #   power=none      20.8/hr   31.5/hr        —
  #
  # and audible pump dips went from 0/day to 3 in one morning.
  #
  # Why: with the radio never sleeping, the WiFi task processes every frame on a busy
  # 2.4GHz channel (including the broadcast management traffic that showed up as bursts
  # of "Invalid MMIE" in the device log). That starves the main loop, which is where the
  # stream server relays RS-485 bytes. ICMP still answers fast because it is handled in
  # the network task — which is exactly why ping looked perfect while telemetry starved.
  # Ping the device and you measure the wrong layer.
  power_save_mode: light
  # Fixed IP so pool-api always finds the bridge. Pick a free address on the LAN at the pad,
  # or set a DHCP reservation instead and delete this block.
  manual_ip:
    static_ip: 192.168.4.60
    gateway: 192.168.4.1
    subnet: 255.255.255.0
  # Fallback hotspot if WiFi is unavailable (useful during first setup at the pad).
  ap:
    ssid: "Poolbridge Fallback"
    password: !secret ap_password

# Logger runs on UART0 (the USB pins GPIO1/3). The RS-485 UART below is on
# GPIO25/26, so they do NOT conflict — keep USB logs for debugging.
# (If you ever want it silent, set: baud_rate: 0)
#
# INFO, not DEBUG: at DEBUG this logs every frame on a 9600-baud bus that carries
# ~1 poll/second, and formatting those strings competes with the stream server for
# the single main loop. Raise it temporarily if you need to debug the bus.
logger:
  level: INFO
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ---------------------------------------------------------------------------
# RS-485 UART  (Pentair = 9600 baud, 8N1)
# ---------------------------------------------------------------------------
uart:
  id: uart_bus
  tx_pin: GPIO25   # -> DI  (driver input) on the MAX485. Moved off GPIO16/17 (dead on this board).
  rx_pin: GPIO26   # <- RO  (receiver output) on the MAX485. WIRED — this is how telemetry gets back.
  baud_rate: 9600
  # Enlarged from the 256-byte default 2026-08-17 (experiment queue Step 2). The gaps we're
  # chasing are missing *telemetry* — dropped RS-485 replies. If the main loop is ever late
  # draining the UART, a bigger buffer absorbs the overrun instead of losing the frame.
  # Costs 256 bytes of RAM (~25% used). See EXPERIMENT-QUEUE.md.
  rx_buffer_size: 512
  # Blue MAX485 module (explicit DE/RE). ESPHome drives DE high during TX via this pin;
  # RE is tied to GND on the board, so the receiver is always enabled.
  flow_control_pin: GPIO27   # -> DE (transmit-enable). THE FIX vs the old auto-direction module.
  # NOTE: the byte-level `debug:` block that used to live here (direction: BOTH, log_hex every
  # 64 bytes / 40ms) was removed 2026-08-11. It was marked TEMP DEBUG and left on in production,
  # where it formatted and emitted a log line for every chunk on the bus — over USB *and* the
  # API — starving the stream server's main loop. Re-add it only for short debugging sessions.

external_components:
  # LOCAL FORK — patched 2026-09-04. Do not revert to the github source without carrying the
  # patches forward; upstream leaks a client socket on any errno other than ECONNRESET, which
  # exhausts CONFIG_LWIP_MAX_SOCKETS (10) and makes the device refuse connections on every
  # listener while still answering ICMP. That is the confirmed cause of the pump dips.
  # Fixes: reap the client on unhandled errno in flush() and write(); correct the
  # std::string{N,0} identifier constructor. See INVESTIGATION-2026-08-31.md.
  - source:
      type: local
      path: components
    components: [stream_server]

# ---------------------------------------------------------------------------
# Expose the UART over TCP. Port must match UPSTREAM_PORT in pool-app's docker-compose.guardian.yml.
# ---------------------------------------------------------------------------
stream_server:
  uart_id: uart_bus
  port: 8899

# ---------------------------------------------------------------------------
# Instrumentation — added 2026-09-04 alongside the socket-leak fix.
# ---------------------------------------------------------------------------
# connection_count is the sensor that settles the leak outright. There should be exactly ONE
# client (pool-guardian). If this climbs and never falls, sockets are leaking; when it pins at
# CONFIG_LWIP_MAX_SOCKETS the device refuses connections on every listener while still answering
# ICMP — which is exactly what was observed 2026-08-29 → 09-04. Watch it with:
#   esphome logs poolbridge.yaml --device 192.168.4.60
sensor:
  - platform: stream_server
    connection_count:
      name: "Bridge client count"

binary_sensor:
  - platform: stream_server
    connected:
      name: "Pool bridge client connected"
